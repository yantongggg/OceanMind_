<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- OceanMind — wave/compass mark, deep-ocean teal/cyan on dark -->
  <defs>
    <linearGradient id="om-teal" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#22B8CF"/>
    </linearGradient>
    <linearGradient id="om-wave" x1="14" y1="30" x2="50" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#22B8CF"/>
    </linearGradient>
  </defs>

  <!-- compass ring -->
  <circle cx="32" cy="32" r="26" stroke="url(#om-teal)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="21" stroke="#2DD4BF" stroke-opacity="0.22" stroke-width="1"/>

  <!-- cardinal ticks -->
  <line x1="32" y1="4"  x2="32" y2="10" stroke="url(#om-teal)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="60" stroke="url(#om-teal)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="4"  y1="32" x2="10" y2="32" stroke="url(#om-teal)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="60" y2="32" stroke="url(#om-teal)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- intercardinal ticks -->
  <line x1="13.6" y1="13.6" x2="17.2" y2="17.2" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="50.4" y1="13.6" x2="46.8" y2="17.2" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="13.6" y1="50.4" x2="17.2" y2="46.8" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="50.4" y1="50.4" x2="46.8" y2="46.8" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"/>

  <!-- compass needle pointing NE -->
  <path d="M32 14 L36.5 27.5 L32 25.2 L27.5 27.5 Z" fill="url(#om-teal)"/>

  <!-- waves across the lower half -->
  <path d="M15 36 C19 32.5, 23 32.5, 27 36 S35 39.5, 39 36 S47 32.5, 49 34.5"
        stroke="url(#om-wave)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M18 43 C21.5 40, 25 40, 28.5 43 S35.5 46, 39 43 S45 40.5, 46.5 42"
        stroke="url(#om-wave)" stroke-width="2.2" stroke-linecap="round" opacity="0.65"/>
</svg>
